<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | AR Designs</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://use.typekit.net/etv7hms.css">
</head>
<body class="contact-page">
  <header>
    <a href="index.html" class="logo-link" aria-label="AR Designs home">
      <img src="images/logo.png" alt="AR Designs logo" class="site-logo">
    </a>
    <h1>AR Designs</h1>
  </header>

  <div id="container">
    <p><span class="quote-line1">Design without soul is like food</span><span class="quote-line2">with no&nbsp;salt.</span></p>
  </div>

  <nav class="site-nav">
    <button type="button" class="nav-toggle" aria-expanded="false" aria-controls="primary-menu" aria-label="Toggle navigation">
      <span></span>
      <span></span>
      <span></span>
    </button>
    <div id="primary-menu" class="nav-links">
      <a href="index.html">Home</a>
      <a href="portfolio.html">Portfolio</a>
      <a href="about.html">About</a>
      <a href="contact.html" aria-current="page">Contact Me</a>
    </div>
  </nav>

  <main>
    <form
      id="contact-form"
      action="https://formsubmit.co/karlalejes0@outlook.com"
      method="POST"
    >
      <input type="hidden" name="_subject" value="New AR Designs contact message">
      <input type="hidden" name="_template" value="table">
      <input type="hidden" name="_captcha" value="false">
      <input type="text" name="_honey" class="contact-honeypot" tabindex="-1" autocomplete="off" aria-hidden="true">
      <table cellpadding="15px" align="center" width="700px" class="contact-table">
        <tr>
          <th colspan="2"><h2 class="contact-title">Contact</h2></th>
        </tr>
        <tr>
          <td class="contact-label-cell"><label class="contact-label" for="contact-name">Name</label></td>
          <td><input id="contact-name" type="text" name="name" placeholder="Your Name" autocomplete="name" required></td>
        </tr>
        <tr>
          <td class="contact-label-cell"><label class="contact-label" for="contact-email">Email</label></td>
          <td><input id="contact-email" type="email" name="email" placeholder="Email" autocomplete="email" required></td>
        </tr>
        <tr>
          <td class="contact-label-cell"><label class="contact-label" for="contact-message">Questions</label></td>
          <td><textarea id="contact-message" name="message" placeholder="Questions" required></textarea></td>
        </tr>
        <tr class="noline">
          <td colspan="2">
            <button type="submit" class="contact-submit">Send Message</button>
            <p id="contact-status" class="contact-status" role="status" aria-live="polite"></p>
          </td>
        </tr>
      </table>
    </form>
  </main>

  <div class="corner-gif-wrap" aria-hidden="true">
    <img src="images/luna.gif" alt="" class="corner-gif">
  </div>

  <footer>
    &copy; 2026 AR Designs
  </footer>
  <script src="script.js"></script>
</body>
</html>
